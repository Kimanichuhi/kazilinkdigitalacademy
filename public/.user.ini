; OPcache tuning that's actually settable per-directory (PHP_INI_ALL/PERDIR).
; opcache.enable, opcache.memory_consumption, and opcache.max_accelerated_files
; are PHP_INI_SYSTEM — they can only take effect from php.ini itself (on
; shared hosting: cPanel's "Select PHP Version" -> Options, or the MultiPHP
; INI Editor). See README.md's "Production PHP checklist" for recommended
; values. This file only carries settings .user.ini can actually apply.

; Safe for both local dev and production: matches PHP's own defaults, so
; this line changes nothing by itself — it's here as a documented place to
; flip on the fully-cached mode below once you have a deploy process that
; always ships a complete, fresh copy of the codebase (this repo's own
; deploy steps do).
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Uncomment for production only. This stops PHP from ever re-checking file
; mtimes, which is the main real-world OPcache win — but it also means
; editing a file in place (rather than a fresh deploy) won't be picked up
; until the PHP process restarts. Never enable this for local development.
; opcache.validate_timestamps=0
